<main id="inicio">

  <!-- ========================================
       BANNER PRINCIPAL MOS
       Sin textos superpuestos
  ========================================= -->
  <section
    class="hero"
    aria-label="MOS Manguelito Official Store"
    style="
      position: relative;
      display: block;
      width: 100%;
      min-height: 0;
      padding: 0;
      margin: 0;
      overflow: hidden;
      background: #0b0b0b;
    "
  >

    <div
      class="hero-mark"
      style="
        position: relative;
        display: block;
        width: 100%;
        height: auto;
        inset: auto;
        margin: 0;
        padding: 0;
        transform: none;
        opacity: 1;
      "
    >

      <img
        src="assets/logos/mos-banner.png"
        alt="MOS Manguelito Official Store"
        style="
          display: block;
          width: 100%;
          height: auto;
          max-width: none;
          margin: 0;
          padding: 0;
          object-fit: contain;
          object-position: center;
          filter: none;
        "
      />

    </div>

  </section>


  <!-- ========================================
       CATÁLOGO
  ========================================= -->
  <section
    id="catalogo"
    class="catalog-section"
  >

    <div class="section-heading">

      <div>

        <p class="eyebrow">
          CATÁLOGO
        </p>

        <h2>
          Catálogo MOS
        </h2>

      </div>


      <p
        id="syncStatus"
        class="sync-status"
        role="status"
      >
        Cargando Productos.xlsx…
      </p>

    </div>


    <!--
      El catálogo se construye automáticamente
      desde Productos.xlsx.

      El JavaScript organiza:

      1. Productos oficiales
         - Ropa
         - Accesorios
         - Items

      2. Colección Basic
         - Ropa
         - Accesorios
         - Items
    -->
    <div
      id="catalogRoot"
      class="catalog-root"
      aria-live="polite"
    ></div>


    <div
      id="emptyState"
      class="empty-state"
      hidden
    >
      No hay productos disponibles.
    </div>

  </section>

</main>
